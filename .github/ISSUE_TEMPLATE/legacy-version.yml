name: "macOS 호환 과거 버전 제보 (recipes/legacy)"
description: "jige가 아직 모르는 토큰+macOS 조합에 쓸 수 있는 Homebrew-Cask 커밋을 찾았을 때"
title: "legacy: <앱 이름> macOS <메이저 버전>"
labels: ["legacy-version"]
body:
  - type: markdown
    attributes:
      value: |
        `jige install <토큰> --find-legacy`나 `tools/legacy_finder.py <토큰> --target-macos <번호>`로
        찾은 결과를 그대로 적어주시면 됩니다 — 둘 다 AI 판단 없이 Homebrew-Cask의 git 기록(또는
        실제 파일의 Info.plist)으로 기계적으로 찾은 값이라 그대로 믿을 수 있습니다.

  - type: input
    id: token
    attributes:
      label: "앱 이름 (token)"
      placeholder: "예: virtualbox"
    validations:
      required: true

  - type: input
    id: macos_major
    attributes:
      label: "macOS 메이저 버전"
      placeholder: "예: 12"
    validations:
      required: true

  - type: input
    id: commit_url
    attributes:
      label: "Homebrew-Cask 커밋 raw URL"
      placeholder: "https://raw.githubusercontent.com/Homebrew/homebrew-cask/<커밋SHA>/Casks/x/token.rb"
    validations:
      required: true

  - type: dropdown
    id: found_by
    attributes:
      label: "어떻게 확인했나요"
      options:
        - "depends_on (그 커밋의 depends_on macos: 선언으로 확인)"
        - "info_plist (실제 파일을 받아 Info.plist의 LSMinimumSystemVersion으로 확인)"
    validations:
      required: true
